name: Snapshot Deploy

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Setup Java 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'
    - name: Build and test
      run: mvn -B -U verify

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - name: Setup Java 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'
    - name: Generate settings.xml
      run: |
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>repsy-snapshots</id>
                <username>${{ secrets.REPSY_USERNAME }}</username>
                <password>${{ secrets.REPSY_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF
    - name: Deploy only snapshot versions
      run: |
        VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
        echo "Detected version: $VERSION"
        if [[ $VERSION == *"SNAPSHOT"* ]]; then
          echo "Deploying snapshot version: $VERSION"
          mvn deploy -U -B -DskipTests
        else
          echo "Skipping deploy for release version: $VERSION"
        fi
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
